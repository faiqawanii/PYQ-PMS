<!DOCTYPE html>
<html>
<head>
  <title>PYQ Management</title>
  <link rel="stylesheet" href="styleLogin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="left">
      <img src="logo_1.jpg" alt="PYQ Logo" width="90" height="90">
      <h1 class="center">Login to Your Account</h1>

      <div class="roles center">
        <button type="button" onclick="selectRole('user')">User</button>
        <button type="button" onclick="selectRole('admin')">Admin</button>
      </div>

      <form id="loginForm">
        <input type="hidden" id="role">

        <div class="input-box right">
          <input type="text" id="username" placeholder="Username">
        </div>

        <div class="input-box right password-box">
          <input type="password" id="password" placeholder="Password">
          <i class="fa fa-eye" onclick="togglePassword()"></i>
        </div>

        <div class="center">
          <button type="submit" class="login-btn">Sign In</button>
        </div>

        <p class="forgot center" onclick="showForgot()">Forgot Password?</p>
      </form>

      <div id="forgotBox" class="hidden center">
        <input type="email" placeholder="Enter your email">
        <button class="reset-btn">Reset Password</button>
      </div>

      <p id="error" class="center"></p>
    </div>

    <div class="right">
      <h1>New Here?</h1>
      <p>Register now to gain instant access to our comprehensive Previous Year Question Papers and start preparing for your exams effectively.</p>
      <button class="signup-btn" onclick="goToSignup()">Sign Up</button>
    </div>
  </div>

  <script src="scriptLogin.js"></script>
</body>
</html>
